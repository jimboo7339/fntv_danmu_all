name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.0'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform files
        run: flutter create --org com.fntv --project-name fnos_tv_all .

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Find and rename APK
        run: |
          echo "=== Looking for APK ==="
          find build -name "*.apk" -type f 2>/dev/null
          VERSION="${GITHUB_REF#refs/tags/}"
          APK=$(find build -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" "FNTV_All_${VERSION}_android.apk"
          echo "Renamed to: FNTV_All_${VERSION}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: FNTV_All_*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/android-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
