name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform files
        run: flutter create --org com.fntv --project-name fnos_tv_all .

      - name: Debug check dart files
        run: |
          echo "=== Dart files ==="
          find lib -name '*.dart' | sort
          echo "=== pubspec.yaml ==="
          cat pubspec.yaml

      - run: flutter pub get

      - name: Build APK verbose
        run: flutter build apk --release -v 2>&1 | tail -200

      - name: Rename APK
        if: success()
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cp build/app/outputs/flutter-apk/app-release.apk "FNTV_All_${VERSION}_android.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: FNTV_All_*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/android-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
