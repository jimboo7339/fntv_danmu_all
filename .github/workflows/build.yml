name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  # ========== Android ==========
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cp build/app/outputs/flutter-apk/app-release.apk "FNTV_All_${VERSION}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: FNTV_All_*.apk

  # ========== Android App Bundle ==========
  build-android-aab:
    name: Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ========== Web ==========
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --web-renderer html

      - name: Archive web build
        run: cd build/web && tar czf ../../FNTV_All_web.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: FNTV_All_web.tar.gz

  # ========== Linux ==========
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Archive linux build
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../../../FNTV_All_linux_x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: FNTV_All_linux_x64.tar.gz

  # ========== macOS ==========
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Archive macOS build
        run: |
          cd build/macos/Build/Products/Release
          tar czf ../../../../../FNTV_All_macos.tar.gz FnTvAll.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: FNTV_All_macos.tar.gz

  # ========== Windows ==========
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Archive Windows build
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath FNTV_All_windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: FNTV_All_windows_x64.zip

  # ========== Release ==========
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-android-aab, build-web, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-aab/*.aab
            artifacts/web/*.tar.gz
            artifacts/linux/*.tar.gz
            artifacts/macos/*.tar.gz
            artifacts/windows/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
