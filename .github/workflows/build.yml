name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Save committed custom files
        run: |
          mkdir -p /tmp/fntv_backup
          cp -r android/app/src/main/res/ /tmp/fntv_backup/res/ 2>/dev/null || true
          cp android/app/fntv-release.p12 /tmp/fntv_backup/ 2>/dev/null || true
          ls -la /tmp/fntv_backup/

      - name: Generate Android platform
        run: |
          rm -rf android
          flutter create --org com.fntv --project-name fnos_tv_all --platforms android .

      - name: Restore custom files
        run: |
          python3 .github/scripts/apply_android_config.py
          python3 .github/scripts/patch_project_gradle.py

          # Restore committed resources (icon, colors)
          cp -r /tmp/fntv_backup/res/* android/app/src/main/res/ 2>/dev/null || true

          # Restore keystore
          cp /tmp/fntv_backup/fntv-release.p12 android/app/ 2>/dev/null || true
          ls -la android/app/fntv-release.p12

      - name: Write signed build.gradle
        run: python3 .github/scripts/patch_signing.py

      - name: Build APK with auto version
        run: |
          flutter pub get
          VERSION="${GITHUB_REF#refs/tags/}"
          # Use run number as versionCode for unique builds
          flutter build apk --release \
            --build-name="${VERSION}" \
            --build-number="${{ github.run_number }}"

      - name: Rename APK
        if: success()
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          APK=$(find . -name "*.apk" -type f | head -1)
          [ -z "$APK" ] && echo "ERROR: No APK!" && exit 1
          cp "$APK" "FNTV_All_${VERSION}_android.apk"
          ls -lh FNTV_All_*.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: FNTV_All_*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release with Chinese Notes
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/android-apk/*.apk
          body: |
            ## 飞牛TV v${{ github.ref_name }} 更新

            ### 本次更新
            - 🎬 新增 MPV (libmpv) 播放内核，解码能力大幅提升
            - ⚙️ 设置页可切换播放内核 (MPV / ExoPlayer)
            - 📝 弹幕设置独立为二级子菜单
            - 👤 多账号管理，支持不同服务器账号切换
            - 🔧 修复退出登录自动重登问题
            - 🎨 底部导航栏 + SafeArea 全面优化
            - 🔏 固定签名，支持覆盖安装

            ### 下载说明
            下载 APK 文件直接安装即可。首次安装需要卸载旧版本（签名变更）。
            后续版本可直接覆盖安装。
          draft: false
          prerelease: false
