name: fnos_tv_all
description: FnOS TV - Cross-platform media client with danmaku support
publish_to: 'none'
version: 0.1.4+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3+3
  video_player: ^2.8.3
  # MPV engine
  media_kit: ^1.1.11
  media_kit_video: 1.2.5
  media_kit_libs_android_video: ^1.3.6
  # Common
  crypto: ^3.0.3
  intl: ^0.19.0
  wakelock_plus: ^1.2.1
  package_info_plus: ^8.0.0
  screen_brightness: ^0.2.2
  flutter_volume_controller: ^1.3.2
  file_picker: ^8.0.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
