group 'com.fntv.ijkplayer'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.fntv.ijkplayer'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Tencent's ijkplayer fork (2025, actively maintained)
    implementation 'com.tencent.iot.thirdparty.android:ijkplayer-java:2.0.17'
    implementation 'com.tencent.iot.thirdparty.android:ijkplayer-arm64:2.0.17'
}
