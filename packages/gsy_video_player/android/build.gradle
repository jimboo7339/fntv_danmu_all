group 'com.alizda.gsy_video_player'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def gsyVideoVersion = '11.0.0'
def danmakuFlameMasterSoVersion = '0.9.25'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alizda.gsy_video_player'
    }

    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.mockito:mockito-core:5.0.0'

    implementation "com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer-java:${gsyVideoVersion}"
    implementation "com.github.CarGuo.GSYVideoPlayer:GSYVideoPlayer-exo2:${gsyVideoVersion}"
    implementation "com.github.CarGuo.GSYVideoPlayer:DanmakuFlameMaster:${danmakuFlameMasterSoVersion}"
}
